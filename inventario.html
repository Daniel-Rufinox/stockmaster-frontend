<!DOCTYPE html><html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Inventário - StockMaster</title>
    <link rel="stylesheet" href="style.css">
</head><body><header>
    <h1>StockMaster</h1>
    <p>Consulta de Inventário</p>
</header><main><a href="index.html" class="back">← Voltar ao Dashboard</a>

<section class="table-container">

    <h2>Inventário de Produtos</h2>

    <br>

    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Quantidade</th>
                <th>Estoque mínimo</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="tabelaProdutos">
        </tbody>
    </table>

</section>

<!-- FORMULÁRIO DE EDIÇÃO -->

<section class="form-container" id="formEdicao" style="display: none;">

    <h2>Editar Produto</h2>

    <input type="hidden" id="editarId">

    <div class="form-group">
        <label for="editarNome">Nome do produto</label>
        <input type="text" id="editarNome">
    </div>

    <div class="form-group">
        <label for="editarCategoria">Categoria</label>
        <input type="text" id="editarCategoria">
    </div>

    <div class="form-group">
        <label for="editarQuantidade">Quantidade</label>
        <input type="number" id="editarQuantidade" min="0">
    </div>

    <div class="form-group">
        <label for="editarEstoqueMinimo">Estoque mínimo</label>
        <input type="number" id="editarEstoqueMinimo" min="0">
    </div>

    <div class="form-group">
        <label for="editarValidade">Data de validade</label>
        <input type="date" id="editarValidade">
    </div>

    <button class="btn btn-primary" onclick="salvarEdicao()">
        Salvar alterações
    </button>

    <button class="btn btn-secondary" type="button" onclick="cancelarEdicao()">
        Cancelar
    </button>

</section>

</main><footer>
    <p>StockMaster © 2026</p>
</footer><script src="script.js"></script></body>
</html>

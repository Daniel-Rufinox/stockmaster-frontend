<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada de Estoque - StockMaster</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>StockMaster</h1>

    <nav>
        <p>⌂ &nbsp; Dashboard</p>
        <p>▣ &nbsp; Produtos</p>
        <p>↕ &nbsp; Movimentações</p>
        <p>▥ &nbsp; Relatórios</p>
        <p>♙ &nbsp; Usuários</p>
        <p>↪ &nbsp; Sair</p>
    </nav>
</header>

<main>

    <a href="index.html" class="back">← Voltar ao Dashboard</a>

    <section class="form-container">

        <h2>Entrada de Estoque</h2>

        <div class="form-group">
            <label for="produtoEntrada">Produto</label>

            <select id="produtoEntrada">
                <option value="">Selecione um produto</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantidadeEntrada">Quantidade</label>

            <input
                type="number"
                id="quantidadeEntrada"
                min="1"
                placeholder="Digite a quantidade"
            >
        </div>

        <button
            class="btn btn-primary"
            type="button"
            onclick="registrarEntrada()"
        >
            Registrar Entrada
        </button>

        <a href="index.html">
            <button
                class="btn btn-secondary"
                type="button"
            >
                Cancelar
            </button>
        </a>

    </section>

</main>

<footer>
    <p>StockMaster © 2026</p>
</footer>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos - StockMaster</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>StockMaster</h1>
    <p>Cadastro de Produtos</p>
</header>

<main>

    <a href="index.html" class="back">← Voltar ao Dashboard</a>

    <section class="form-container">

        <h2>Novo Produto</h2>

        <div class="form-group">
            <label for="nomeProduto">Nome do produto</label>

            <input
                type="text"
                id="nomeProduto"
                placeholder="Digite o nome do produto"
            >
        </div>

        <div class="form-group">
            <label for="categoriaProduto">Categoria</label>

            <input
                type="text"
                id="categoriaProduto"
                placeholder="Digite a categoria"
            >
        </div>

        <div class="form-group">
            <label for="quantidadeProduto">Quantidade inicial</label>

            <input
                type="number"
                id="quantidadeProduto"
                min="0"
                placeholder="Digite a quantidade"
            >
        </div>

        <div class="form-group">
            <label for="estoqueMinimo">Estoque mínimo</label>

            <input
                type="number"
                id="estoqueMinimo"
                min="0"
                placeholder="Digite o estoque mínimo"
            >
        </div>

        <div class="form-group">
            <label for="validadeProduto">Data de validade</label>

            <input
                type="date"
                id="validadeProduto"
            >
        </div>

        <button class="btn btn-primary" onclick="cadastrarProduto()">
            Cadastrar Produto
        </button>

        <a href="index.html">
            <button class="btn btn-secondary" type="button">
                Cancelar
            </button>
        </a>

    </section>

</main>

<footer>
    <p>StockMaster © 2026</p>
</footer>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos - StockMaster</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>StockMaster</h1>
        <p>Cadastro de Produtos</p>
    </header>

    <main>
        <section class="menu">
            <h2>Novo Produto</h2>

            <label>Nome do produto</label>
            <input type="text" id="nomeProduto" placeholder="Digite o nome do produto">

            <label>Categoria</label>
            <input type="text" id="categoriaProduto" placeholder="Digite a categoria">

            <label>Quantidade</label>
            <input type="number" id="quantidadeProduto" placeholder="Digite a quantidade">

            <label>Estoque mínimo</label>
            <input type="number" id="estoqueMinimo" placeholder="Digite o estoque mínimo">

            <button onclick="cadastrarProduto()">Cadastrar Produto</button>

            <br><br>

            <button onclick="window.location.href='index.html'">
                Voltar ao Dashboard
            </button>
        </section>
    </main>

    <footer>
        <p>StockMaster © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
